version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: freelance_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freelance
    ports:
      - "5432:5432"

  auth-service:
    build: ./backend/auth-service
    container_name: auth_service
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/freelance
      JWT_SECRET: supersecret

  api-gateway:
    build: ./backend/api-gateway
    container_name: api_gateway
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
    environment:
      AUTH_SERVICE_URL: "http://auth-service:5000"